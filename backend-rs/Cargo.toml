[package]
name = "cadence-cx-server"
version = "0.1.0"
edition = "2021"
description = "Rust (Axum + PostgreSQL) backend for Cadence CX — QA & Knowledge Management"

[[bin]]
name = "cadence-cx-server"
path = "src/main.rs"

[dependencies]
axum = { version = "0.7", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "fs", "set-header"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "json"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
hex = "0.4"
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "stream", "multipart", "charset"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rsa = { version = "0.9", features = ["sha2"] }
calamine = "0.30"
csv = "1"
ldap3 = { version = "0.11", default-features = false, features = ["tls-native"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls"] }
