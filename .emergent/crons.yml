crons:
  - name: daily-qa-digest
    description: "Emails team leads the day's lowest QA scores and compliance flags at 8pm IST"
    cron: "0 20 * * *"
    timezone: "Asia/Kolkata"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/digest"
    method: POST
    enabled: true
